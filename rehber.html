<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wegweiser">
<title>Wegweiser</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Wegweiser: Almanca rehber. Koyu yeşil başlık, açık kâğıt zemin, bölümler için renkli kutucuklar. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface2:#f5f8f6; --ink:#12211d; --soft:#56655f; --line:#d8e1dd;
  --head:#10231f; --head-ink:#f1f6f4; --head-soft:#9fb8b0;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-bg:#d9efeb;
  --gold:#a46512; --gold-bg:#fbefd9; --ok:#15803d; --ok-bg:#dcf2e3; --bad:#b42318; --bad-bg:#fbe4e1;
  --der:#1d5fbf; --die:#c0264b; --das:#1b7f4a;
  --shadow:0 1px 2px rgba(16,35,31,.06),0 8px 24px rgba(16,35,31,.07);
  --f-ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-de:'Newsreader',Georgia,'Times New Roman',serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1412; --surface:#141f1c; --surface2:#192622; --ink:#e4eeea; --soft:#9ab0a8; --line:#25352f;
  --head:#08110f; --head-ink:#e9f2ee; --head-soft:#86a39a;
  --accent:#4fd1c0; --accent-ink:#04201c; --accent-bg:#113a35;
  --gold:#f0b45a; --gold-bg:#33270f; --ok:#5fd28c; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1c19;
  --der:#86b3ff; --die:#ff8fab; --das:#6fdc9c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1412; --surface:#141f1c; --surface2:#192622; --ink:#e4eeea; --soft:#9ab0a8; --line:#25352f;
  --head:#08110f; --head-ink:#e9f2ee; --head-soft:#86a39a;
  --accent:#4fd1c0; --accent-ink:#04201c; --accent-bg:#113a35;
  --gold:#f0b45a; --gold-bg:#33270f; --ok:#5fd28c; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1c19;
  --der:#86b3ff; --die:#ff8fab; --das:#6fdc9c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* Kopf */
.head{background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top)}
.head .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand h1 .flag{display:inline-flex;flex-direction:column;width:6px;height:20px;border-radius:2px;overflow:hidden}
.brand h1 .flag i{flex:1}
.brand p{margin:0;font-size:13px;color:var(--head-soft)}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid color-mix(in srgb,var(--head-ink) 18%,transparent);background:transparent;color:var(--head-ink);display:grid;place-items:center;flex:none}
.hbtn svg{width:20px;height:20px}
.levels{background:var(--head);padding-bottom:14px;position:sticky;top:0;z-index:5}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:color-mix(in srgb,var(--head-ink) 9%,transparent);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;color:var(--head-soft);border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button[aria-current="true"]{background:var(--head-ink);color:var(--head)}
.seg svg{width:15px;height:15px;flex:none}
.seg button{white-space:nowrap;min-width:0}
.seg .cnt{font-size:11px;line-height:1;padding:3px 5px;border-radius:999px;background:var(--gold);color:var(--head)}

/* Innenseiten-Leiste */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.bar h2{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h2 small{display:block;font-size:12px;font-weight:500;color:var(--soft)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.ibtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trbtn{width:auto;padding:0 10px;font-size:13px;font-weight:700}

main{padding-block:16px 40px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Startseite */
.hero{margin:6px 0 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero h3{margin:0;font-size:26px;letter-spacing:-.02em}
.hero p{margin:2px 0 0;color:var(--soft);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:132px;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--hue) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--hue) 30%,transparent)}
.tile b{font-size:15px;line-height:1.2;font-weight:700;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.tile span{font-size:13px;color:var(--soft);line-height:1.25}
.tile em{margin-top:auto;font-style:normal;font-size:12px;font-weight:600;color:color-mix(in srgb,var(--hue) 75%,var(--ink))}
.searchlink{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--soft)}
.searchlink svg{width:18px;height:18px}

/* Listen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;background:none;border:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row .t span{display:block;color:var(--soft);font-size:14px}
.row .em{font-size:22px;width:34px;text-align:center;flex:none}
.row .n{font-size:12px;color:var(--soft);font-weight:600;flex:none}
.row svg.chev{width:18px;height:18px;color:var(--soft);flex:none}
.grp{margin:8px 2px 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;gap:8px}
.grp span{text-transform:none;letter-spacing:0;font-weight:500}

/* Satz-Zeilen */
.ph{display:flex;gap:6px;padding:12px 8px 12px 14px;align-items:flex-start}
.ph .t{flex:1;min-width:0;cursor:pointer}
.de{font-family:var(--f-de);font-size:18px;line-height:1.35;margin:0;overflow-wrap:anywhere}
.tr{margin:3px 0 0;font-size:14px;color:var(--soft)}
.ex{margin:6px 0 0;font-family:var(--f-de);font-style:italic;font-size:16px}
.ex+.tr{margin-top:1px}
body.hide-tr .ph:not(.open) .tr{visibility:hidden;height:0;margin:0}
body.hide-tr .ph:not(.open) .t::after{content:'Türkçesi için dokun';display:block;font-size:12px;color:var(--soft);opacity:.7;margin-top:2px}
.acts{display:flex;flex:none}
.act{width:38px;height:38px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--soft)}
.act svg{width:20px;height:20px}
.act.on{color:var(--gold)}
.act:active{background:var(--surface2)}
.term{font-weight:700;font-size:17px;margin:0;overflow-wrap:anywhere}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}

/* Banner & Optionen */
.banner{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow)}
.banner span{flex:1}
.banner small{display:block;font-weight:500;opacity:.85}
.banner svg{width:20px;height:20px}
.opts3{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.opt .em{font-size:28px}
.opt b{display:block;font-size:17px}
.opt span{color:var(--soft);font-size:14px}

/* Suche */
.sbox{position:relative}
.sbox input{width:100%;padding:13px 44px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.sbox svg.s{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--soft)}
.sbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;display:grid;place-items:center;color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--soft)}
.tag.gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.tag.acc{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.muted{color:var(--soft)} .small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--soft)}

/* Verb-Seite */
.vhead{padding:18px 16px}
.vhead h3{margin:0;font-family:var(--f-de);font-size:32px;font-weight:500;line-height:1.1;overflow-wrap:anywhere}
.vhead h3 .sep{color:var(--accent)}
.vhead .tr{font-size:16px;margin-top:6px}
.vhead .chips{margin-top:10px}
.stamm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.stamm div{padding:12px 10px;text-align:center}
.stamm div+div{border-left:1px solid var(--line)}
.stamm small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.stamm b{font-family:var(--f-de);font-weight:500;font-size:17px;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none;margin:0 -2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctab{width:100%;border-collapse:collapse}
.ctab td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.ctab tr:first-child td{border-top:0}
.ctab td.p{width:1%;white-space:nowrap;color:var(--soft);font-size:14px;font-weight:600}
.ctab td.f{font-family:var(--f-de);font-size:18px}
.ctab td.a{width:1%;padding:0 6px}
.note{padding:12px 14px;border-radius:12px;background:var(--gold-bg);color:var(--ink);font-size:14px}
.note b{color:var(--gold)}

/* Lektion */
.lesson h4{margin:8px 0 0;font-size:19px;letter-spacing:-.01em}
.lesson p{margin:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
.tbl thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);background:var(--surface2)}
.tbl td:first-child{font-weight:600}
.tbl b{color:var(--accent)}
.tip{padding:12px 14px;border-left:4px solid var(--gold);background:var(--gold-bg);border-radius:0 12px 12px 0;font-size:15px}
.tip b{color:var(--gold)}
.q{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.q p{margin:0 0 10px;font-family:var(--f-de);font-size:18px}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qopts button{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-family:var(--f-de);font-size:16px;text-align:center;overflow-wrap:anywhere}
.qopts button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.qopts button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.score{font-weight:700;text-align:center;padding:10px;border-radius:12px;background:var(--accent-bg);color:var(--accent)}

/* Bild & Dialog & Brief */
.scene{aspect-ratio:16/9;border-radius:var(--r);display:grid;place-items:center;font-size:clamp(44px,13vw,78px);letter-spacing:.06em;background:linear-gradient(160deg,color-mix(in srgb,var(--hue) 24%,var(--surface)),color-mix(in srgb,var(--hue) 8%,var(--surface)));border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.scene::after{content:'';position:absolute;inset:10px;border:2px dashed color-mix(in srgb,var(--hue) 35%,transparent);border-radius:10px;pointer-events:none}
.thumb{width:52px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--hue) 16%,var(--surface));flex:none;letter-spacing:-.1em}
.task{padding:14px 16px;border-radius:var(--r);background:var(--accent-bg);color:var(--ink);font-size:15px}
.task b{display:block;color:var(--accent);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.dlg{display:flex;flex-direction:column;gap:10px}
.bub,.bub.ph{display:block;max-width:88%;padding:10px 6px 10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.bub.b{align-self:flex-end;background:var(--accent-bg);border-color:transparent}
.bub .who{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
.bub .row2{display:flex;gap:4px;align-items:flex-start}
.bub .row2 .t{flex:1;cursor:pointer}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:22px 18px;position:relative}
.paper .ln{padding:6px 0;cursor:pointer}
.paper .ln .de{font-size:17px}
.paper .ln.sig .de{font-style:italic}

/* Karten */
.fc{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:26px 18px;cursor:pointer}
.fc .front{font-family:var(--f-de);font-size:26px;line-height:1.25;overflow-wrap:anywhere}
.fc .back{font-size:18px;color:var(--soft);border-top:1px dashed var(--line);padding-top:12px;width:100%}
.fc .hint{font-size:13px;color:var(--soft)}
.fcbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcbtns .btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcbtns .btn svg{flex:none}
.btn{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn svg{width:18px;height:18px}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:13px;color:var(--soft);margin-top:18px}
.foot a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="rehber/verben.js"></script>
<script src="rehber/engine.js"></script>

<script src="rehber/b2.js"></script>
<script src="rehber/b2briefe.js"></script>
<script src="rehber/b2sprechen.js"></script>
<script src="rehber/b2extra.js"></script>
<script src="rehber/c1.js"></script>
<script src="rehber/c1texte.js"></script>
<script src="rehber/c1extra.js"></script>
<script src="rehber/c1wort2.js"></script>
<script src="rehber/c1wort3.js"></script>
<script src="rehber/c1nominal.js"></script>
<script src="rehber/woerter.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
function hash(s) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) | 0; return (h >>> 0).toString(36); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('wg.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wg.' + k, JSON.stringify(v)); } catch (e) {} },
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

function parseGroups(str, cols) {
  const out = []; let g = null;
  for (const raw of str.split('\n')) {
    const line = raw.trim(); if (!line) continue;
    if (line[0] === '#') { const p = line.slice(1).split('|'); g = { title: p[0], tr: p[1] || '', emoji: p[2] || '', items: [] }; out.push(g); continue; }
    const p = line.split('|'); if (p.length < cols) continue; g.items.push(p);
  }
  return out;
}
function mergeGroups(groups) { // aynı adlı kategorileri tek grupta toplar
  const out = [];
  for (const g of groups) { const t = out.find(x => x.title === g.title); if (t) t.items.push(...g.items); else out.push(g); }
  return out;
}
const BRIEF_GROUPS = [['Einladung', 'Davet, tebrik ve cevap'], ['Bitte', 'Rica, yardım ve teşekkür'], ['Entschuldigung', 'Mazeret, hastalık ve erteleme'], ['Anfrage', 'Bilgi talebi ve başvuru'], ['Beschwerde', 'Şikâyet ve reklamasyon'], ['Mitteilung', 'Arıza ve bildirim'], ['Kündigung', 'Fesih ve iptal']];
function sortBriefe(list) { const o = g => { const k = BRIEF_GROUPS.findIndex(x => x[0] === g); return k < 0 ? 99 : k; }; return list.map((b, k) => [b, k]).sort((x, y) => o(x[0].g) - o(y[0].g) || x[1] - y[1]).map(x => x[0]); }
function parseEntries(str) { // "=başlık|…" + "~bölüm" / "?noktalar" + satırlar
  const out = []; let e = null, sec = null;
  for (const raw of str.split('\n')) {
    const line = raw.trim(); if (!line) continue;
    if (line[0] === '=') { const p = line.slice(1).split('|'); e = { title: p[0], tr: p[1], a: p[2], b: p[3], g: p[4] || '', secs: [], points: '' }; sec = { name: '', lines: [] }; e.secs.push(sec); out.push(e); continue; }
    if (line[0] === '~') { sec = { name: line.slice(1), lines: [] }; e.secs.push(sec); continue; }
    if (line[0] === '?') { e.points = line.slice(1); continue; }
    const i = line.indexOf('|'); sec.lines.push([line.slice(0, i), line.slice(i + 1)]);
  }
  for (const x of out) x.secs = x.secs.filter(s => s.lines.length);
  return out;
}

const speech = { voice: null };

function pickVoice() { if (!canSpeak()) return; const vs = speechSynthesis.getVoices(); speech.voice = vs.find(v => /^de[-_]DE/i.test(v.lang) && /google|natural|premium|enhanced/i.test(v.name)) || vs.find(v => /^de[-_]DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null; }

function say(text) {
  if (!canSpeak()) { toast('Bu cihazda seslendirme yok'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/…/g, '').replace(/\s\/\s/g, ', ').replace(/\(.*?\)/g, ''));
  u.lang = 'de-DE'; if (speech.voice) u.voice = speech.voice; u.rate = 0.92; speechSynthesis.speak(u);

// Aynı boşluğa doğru olarak girebilecek bağlaçlar birbirinin yanlış şıkkı olmaz.
const KONN_SYN = [['trotzdem', 'dennoch', 'gleichwohl', 'nichtsdestotrotz'], ['deshalb', 'also', 'folglich', 'infolgedessen', 'demzufolge', 'mithin'], ['weil', 'da', 'zumal'], ['wenn', 'falls', 'sofern', 'solange'], ['seit', 'seitdem'], ['obwohl', 'wenngleich', 'auch', 'selbst'], ['wahrend', 'wohingegen', 'indes'], ['dann', 'danach'], ['inzwischen', 'mittlerweile'], ['damit', 'um'], ['nachdem', 'sobald'], ['wegen', 'aufgrund', 'infolge', 'angesichts', 'dank'], ['statt', 'anstelle'], ['bezuglich', 'hinsichtlich'], ['anhand', 'mithilfe'], ['innerhalb', 'ausserhalb', 'oberhalb', 'unterhalb', 'wahrend', 'entlang'], ['trotz', 'ungeachtet'], ['hingegen', 'dagegen', 'demgegenuber', 'wohingegen'], ['aufgrund dessen', 'infolgedessen', 'demzufolge', 'folglich', 'mithin', 'sodass'], ['daruber hinaus', 'uberdies', 'zudem', 'nicht zuletzt'], ['damit', 'zwecks', 'zu diesem zweck'], ['sofern', 'vorausgesetzt', 'im falle', 'es sei denn'], ['wenngleich', 'gleichwohl', 'nichtsdestotrotz', 'ungeachtet']];
function konnTest(groups, id, title) {
  // Her bağlacın örnek cümlesinde bağlacı boşluk yapar; şıklar aynı listedeki diğer bağlaçlardan gelir.
  const items = groups.flatMap(g => g.items).filter(([t]) => !t.includes('…'));
  const heads = items.map(([t]) => t.split(/\s*\/\s*|\s+\+|,/)[0].trim());
  const qs = [];
  items.forEach(([, , ex], i) => {
    const h = heads[i];
    const m = new RegExp(`(^|[\\s,])(${h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=[\\s,.!?])`, 'i').exec(ex); if (!m) return;
    const at = m.index + m[1].length, start = at === 0;
    const fix = w => start ? w[0].toUpperCase() + w.slice(1) : w;
    const ans = fix(m[2]);
    const syn = KONN_SYN.find(g => g.includes(norm(h))) || [norm(h)];
    const others = shuffle([...new Set(heads.filter(x => !syn.includes(norm(x))))]).slice(0, 3).map(fix);
    const opts = shuffle([ans, ...others]);
    qs.push({ q: ex.slice(0, at) + '___' + ex.slice(at + m[2].length), opts, ok: opts.indexOf(ans) });
  });
  return bar(title, '10 rastgele soru') + `<main class="wrap stack lesson"><div class="stack" data-quiz>${shuffle(qs).slice(0, 10).map((q, i) => quizQ(q, i)).join('')}<div class="score" hidden></div></div><a class="btn pri" href="#/s/${id}/test" data-newtest>Yeni sorular</a></main>`;
}
function praepTest() {
  const PREPS = ['an', 'auf', 'für', 'über', 'um', 'von', 'mit', 'nach', 'zu', 'aus', 'vor', 'bei', 'in'];
  const qs = [];
  for (const [t, tr] of D.b2praep.flatMap(g => g.items)) {
    const m = /^(.+?) (an|auf|für|über|um|von|mit|nach|zu|aus|vor|bei|in) \+ (A|D)$/.exec(t); if (!m) continue;
    const opts = shuffle([m[2], ...shuffle(PREPS.filter(p => p !== m[2])).slice(0, 3)]);
    qs.push({ q: `${m[1]} ___ (${tr})`, opts, ok: opts.indexOf(m[2]) });
  }
  return bar('Edat alıştırması', '10 rastgele soru') + `<main class="wrap stack lesson"><div class="stack" data-quiz>${shuffle(qs).slice(0, 10).map((q, i) => quizQ(q, i)).join('')}<div class="score" hidden></div></div><a class="btn pri" href="#/s/b2praep/test" data-newtest>Yeni sorular</a></main>`;
}
function stammTest() {
  const pool = IRR_LIST.filter(v => v.star && !['sein', 'haben', 'werden'].includes(v.inf));
  const qs = shuffle(pool.slice()).slice(0, 10).map(v => {
    const c = E.conjugate(v.inf); const right = `${v.praet} – ${c.stamm[2]}`;
    const st = v.inf.replace(/en$/, '').replace(/n$/, '');
    const wrong = new Set([`${st}te – hat ge${st}t`, `${v.praet}te – ${c.aux === 's' ? 'hat' : 'ist'} ${v.pp}`, `${v.praet} – ${c.aux === 's' ? 'ist' : 'hat'} ge${st}t`, `${st}te – ${c.stamm[2]}`]);
    wrong.delete(right);
    const opts = shuffle([right, ...shuffle([...wrong]).slice(0, 3)]);
    return { q: `${v.inf} (${v.tr})`, opts, ok: opts.indexOf(right) };
  });
  return bar('Stammformen testi', 'Präteritum – Perfekt') + `<main class="wrap stack lesson"><div class="stack" data-quiz>${qs.map((q, i) => quizQ(q, i)).join('')}<div class="score" hidden></div></div><a class="btn pri" href="#/s/stark/test" data-newtest>Yeni sorular</a></main>`;
}

  ${levelSeg('karten')}
  <main class="wrap stack">
    <div class="stats"><div class="stat"><b>${all.length}</b><span>kartım</span></div><div class="stat"><b>${due}</b><span>tekrar zamanı</span></div><div class="stat"><b>${learned}</b><span>öğrenildi</span></div></div>
    <div class="chips" role="group" aria-label="Yön"><button class="chip" data-dir="de" aria-pressed="${dir === 'de'}">Almanca → Türkçe</button><button class="chip" data-dir="tr" aria-pressed="${dir === 'tr'}">Türkçe → Almanca</button></div>
    ${all.length ? `<button class="btn pri" data-study="mine">${I.cards} ${due ? `Tekrar et (${due})` : 'Kartlarımı çalış'}</button>` : `<div class="card pad"><b>Henüz kartın yok.</b><p class="muted" style="margin:6px 0 0">Herhangi bir cümlenin, kelimenin veya fiilin yanındaki ${I.star.replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px"')} işaretine dokun; burada kartın olur ve aralıklı tekrarla çalışırsın.</p></div>`}
    <div class="grp">Hazır desteler<span>20 rastgele kart</span></div>
    <ul class="list">${decks().slice(1).map(d => `<li><button class="row" data-study="${d.id}"><span class="t"><b lang="de">${esc(d.de)}</b><span>${esc(d.tr)} · ${d.cards().length}</span></span>${I.chev}</button></li>`).join('')}</ul>
    ${all.length ? `<div class="grp">Kartlarım<span>${all.length}</span></div><ul class="list">${all.sort((a, b) => (b[1].t || 0) - (a[1].t || 0)).map(([id, c]) => { REG.set(id, { de: c.de, tr: c.tr }); return `<li class="ph"><div class="t"><p class="de" lang="de">${esc(c.de)}</p><p class="tr">${esc(c.tr)}</p></div><div class="acts">${sayBtn(c.de)}${starBtn(id)}</div></li>`; }).join('')}</ul>` : ''}
  </main>`;
}
function startStudy(deckId) {
  const d = decks().find(x => x.id === deckId); if (!d) return;
  let cards = d.cards();
  if (deckId === 'mine') { const now = Date.now(); const due = cards.filter(c => (CARDS[c.id].due || 0) <= now); cards = (due.length ? shuffle(due) : shuffle(cards)).slice(0, 30); }
  else cards = shuffle(cards).slice(0, 20);
  if (!cards.length) { toast('Bu destede kart yok'); return; }
  SESSION = { deck: d, cards, i: 0, flip: false, ok: 0, bad: 0, dir: store.get('dir', 'de') };
  location.hash = '#/karten/lernen';
}
function renderStudy() {
  const S = SESSION; if (!S) { return renderKarten(); }
  if (S.i >= S.cards.length) return bar(S.deck.de, 'Bitti') + `<main class="wrap stack"><div class="card pad" style="text-align:center"><p style="font-size:40px;margin:0">🎉</p><h3 style="margin:6px 0">Tur bitti</h3><p class="muted">${S.ok} bildin · ${S.bad} tekrar</p></div>
    <button class="btn pri" data-study="${S.deck.id}">Yeni tur</button><a class="btn" href="#/karten">Kartlara dön</a></main>`;
  const c = S.cards[S.i], front = S.dir === 'de' ? c.de : c.tr, back = S.dir === 'de' ? c.tr : c.de;
  return bar(S.deck.de, `${S.i + 1} / ${S.cards.length}`) + `<main class="wrap stack">
    <div class="prog"><i style="width:${(S.i / S.cards.length) * 100}%"></i></div>
    <section class="card fc" data-flip><div class="front" ${S.dir === 'de' ? 'lang="de"' : ''}>${esc(front)}</div>${S.flip ? `<div class="back" ${S.dir === 'tr' ? 'lang="de"' : ''}>${esc(back)}</div>` : '<div class="hint">Cevabı görmek için dokun</div>'}</section>
    ${S.flip ? `<div class="fcbtns"><button class="btn bad" data-grade="0">Bilmedim</button><button class="btn good" data-grade="1">Bildim</button></div>` : `<button class="btn pri" data-flip>Cevabı göster</button>`}
    <button class="btn" data-say="${esc(c.de)}">${I.play} Almancasını dinle</button>
    ${S.deck.id !== 'mine' ? '<p class="muted small" style="text-align:center;margin:0">"Bilmedim" dediğin kartlar otomatik olarak Kartlarım\'a eklenir.</p>' : ''}
  </main>`;
}
function grade(ok) {
  const S = SESSION; const c = S.cards[S.i];
  if (S.deck.id === 'mine') { const k = CARDS[c.id]; if (k) { k.box = ok ? Math.min((k.box || 0) + 1, STEPS.length - 1) : 0; k.due = Date.now() + (ok ? STEPS[k.box] * DAY : 0); } }
  else if (!ok) { const id = hash(c.de + '|' + c.tr); if (!CARDS[id]) CARDS[id] = { de: c.de, tr: c.tr, box: 0, due: 0, t: Date.now() }; }
  store.set('cards', CARDS);
  if (ok) S.ok++; else S.bad++;
  S.i++; S.flip = false; render();
}

/* ---------- Arama ---------- */
let SEARCH_INDEX = null;
function buildIndex() {
  const out = [];
  const add = (de, tr, where, href) => out.push({ de, tr, where, href, k: norm(de + ' ' + tr) });
  D.alltag.forEach((g, i) => g.items.forEach(([de, tr]) => add(de, tr, 'Alltagsdeutsch · ' + g.title, `#/s/alltag/${i}`)));
  const grp = (gs, name, href) => gs.forEach(g => g.items.forEach(p => add(p[0], p[1], name, href)));
  grp(D.bildThemes, 'Bild · Themes', '#/s/bild/themes'); grp(D.planRed, 'Planen kalıpları', '#/s/planen/kalip'); grp(D.briefRed, 'Brief kalıpları', '#/s/briefe/kalip');
  grp(D.konj, 'Konjunktionen', '#/s/konj'); grp(D.b2praep, 'Verben mit Präpositionen', '#/s/b2praep'); grp(D.b2nvv, 'Nomen-Verb-Verbindungen', '#/s/b2nvv'); grp(D.b2konn, 'Konnektoren B2', '#/s/b2konn'); grp(D.b2red, 'Redemittel B2', '#/s/b2red');
  grp(D.b2wort, 'B2 Wortschatz', '#/s/b2wort'); grp(D.genitiv, 'Präpositionen mit Genitiv', '#/s/genitiv');
  for (const [key, name] of [['b2briefe', 'B2 Brief'], ['beruf', 'Beruf Brief'], ['b2praes', 'Präsentation'], ['b2problem', 'Problemlösung'], ['b2disk', 'Diskussion']])
    D[key].forEach((e, i) => { add(e.title, e.tr, name, `#/s/${key}/${i}`); e.secs.forEach(s => s.lines.forEach(([de, tr]) => add(de.replace(/^[AB]:\s*/, ''), tr, name + ' · ' + e.title, `#/s/${key}/${i}`))); });
  grp(D.c1wort, 'C1 Wortschatz', '#/s/c1wort'); grp(D.idiom, 'Idiomatische Verben', '#/s/idiom'); grp(D.passers, 'Passiv-Ersatzformen', '#/s/passers');
  grp(D.grafik, 'Grafikbeschreibung', '#/s/grafik'); grp(D.c1nvv, 'C1 Nomen-Verb', '#/s/c1nvv'); grp(D.sprich, 'Sprichwörter', '#/s/sprich');
  D.c1themen.forEach((g, i) => g.items.forEach(([de, tr]) => add(de, tr, 'C1 Thema · ' + g.title, `#/s/c1themen/${i}`)));
  for (const [key, name] of [['c1zitate', 'C1 Zitat'], ['c1praes', 'C1 Präsentation'], ['c1briefe', 'C1 Brief']])
    D[key].forEach((e, i) => { add(e.title, e.tr, name, `#/s/${key}/${i}`); e.secs.forEach(s => s.lines.forEach(([de, tr]) => add(de, tr, name + ' · ' + e.title, `#/s/${key}/${i}`))); });
  grp(D.nominal, 'Nominalisierung', '#/s/nominal'); grp(D.redew, 'Redewendungen', '#/s/redew'); grp(D.partikeln, 'Modalpartikeln', '#/s/partikeln'); grp(D.c1red, 'Redemittel C1', '#/s/c1red'); grp(D.c1konn, 'Konnektoren C1', '#/s/c1konn');
  D.bild.forEach((b, i) => { add(b.title, b.tr, 'Bildbeschreibung', `#/s/bild/mit/${i}`); b.secs.forEach(s => s.lines.forEach(([de, tr]) => add(de, tr, 'Bild · ' + b.title, `#/s/bild/mit/${i}`))); });
  D.planen.forEach((p, i) => { add(p.title, p.tr, 'Gemeinsam planen', `#/s/planen/${i}`); p.secs.forEach(s => s.lines.forEach(([de, tr]) => add(de.replace(/^[AB]:\s*/, ''), tr, 'Planen · ' + p.title, `#/s/planen/${i}`))); });
  D.briefe.forEach((b, i) => { add(b.title, b.tr, 'B1 Brief', `#/s/briefe/${i}`); b.secs.forEach(s => s.lines.forEach(([de, tr]) => add(de, tr, 'Brief · ' + b.title, `#/s/briefe/${i}`))); });
  for (const v of VMAP.values()) add(E.parseSpec(v.spec).label, v.tr, 'Fiil', `#/verb/${encodeURIComponent(v.spec)}`);
  D.words.forEach(g => g.items.forEach(([de, tr]) => add(de, tr, `Wortschatz ${g.lvl} · ${g.title}`, '')));
  return out;
}
function renderSearch() { return bar('Ara', 'Tüm bölümlerde') + `<main class="wrap stack">${searchBox('Almanca veya Türkçe yaz…', UI.sq || '')}<div id="sres" class="stack"></div></main>`; }
function fillSearch() {
  const el = $('#sres'); if (!el) return;
  const q = norm((UI.sq || '').trim());
  if (q.length < 2) { el.innerHTML = '<p class="empty">En az 2 harf yaz. Örnek: <i>Termin</i>, <i>kira</i>, <i>abholen</i>.</p>'; return; }
  SEARCH_INDEX = SEARCH_INDEX || buildIndex();
  const hits = SEARCH_INDEX.filter(x => x.k.includes(q));
  const rank = x => (norm(x.de).startsWith(q) ? 0 : 1) + (x.where === 'Fiil' ? -1 : 0);
  hits.sort((a, b) => rank(a) - rank(b));
  el.innerHTML = hits.length ? `<p class="muted small" style="margin:0 2px">${hits.length} sonuç${hits.length > 80 ? ' · ilk 80' : ''}</p><ul class="list">${hits.slice(0, 80).map(h => h.href
    ? `<li><a class="row" href="${h.href}"><span class="t"><b lang="de" style="font-family:var(--f-de);font-weight:500">${esc(h.de)}</b><span>${esc(h.tr)}</span><span class="small" style="color:var(--accent)">${esc(h.where)}</span></span>${I.chev}</a></li>`
    : `<li class="ph"><div class="t"><p class="de ${artClass(h.de)}" lang="de">${esc(h.de)}</p><p class="tr">${esc(h.tr)}</p><p class="small" style="margin:2px 0 0;color:var(--accent)">${esc(h.where)}</p></div><div class="acts">${sayBtn(h.de)}${starBtn(reg(h.de, h.tr))}</div></li>`).join('')}</ul>` : '<p class="empty">Sonuç yok.</p>';
}

/* ---------- Yönlendirme ---------- */
const UI = { q: '', sq: '', wl: store.get('wl', 'B1'), tense: 'Präsens' };
let ROUTE = {};
const scrollMem = new Map(); let navStack = [];
function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const p = h.split('/');
  if (!h) return { v: 'home', lvl: store.get('lvl', 'a') };
  if (p[0] === 'lvl') return { v: 'home', lvl: p[1] };
  if (p[0] === 's') return { v: 'sec', id: p[1], sub: p[2], sub2: p[3] };
  if (p[0] === 'verb') return { v: 'verb', spec: p.slice(1).join('/') };
  if (p[0] === 'karten') return { v: p[1] === 'lernen' ? 'study' : 'home', lvl: 'karten' };
  if (p[0] === 'suche') { if (p[1]) UI.sq = p.slice(1).join('/'); return { v: 'search' }; }
  return { v: 'home', lvl: 'a' };
}
function render() {
  ROUTE = parseHash();
  const app = $('#app'); let html;
  if (ROUTE.v === 'home') html = renderHome(ROUTE.lvl);
  else if (ROUTE.v === 'sec') html = renderSection(ROUTE.id, ROUTE.sub, ROUTE.sub2);
  else if (ROUTE.v === 'verb') html = renderVerb(ROUTE.spec);
  else if (ROUTE.v === 'study') html = renderStudy();
  else if (ROUTE.v === 'search') html = renderSearch();
  app.innerHTML = html;
  fillVerbList(); fillWords(); fillGloss(); fillBriefe(); fillSearch();
  applyTr();
  if (ROUTE.v === 'sec' && SEC[ROUTE.id]) { const h = app.querySelector('.bar h2'), ht = h && h.firstChild ? h.firstChild.textContent.trim() : ''; try { localStorage.setItem('satzheft.lastRehber', JSON.stringify({ h: location.hash, t: ht || SEC[ROUTE.id].de, s: SEC[ROUTE.id].de, at: Date.now() })); } catch (e) {} }
  const t = { home: 'Wegweiser', search: 'Ara · Wegweiser', study: 'Kartlar · Wegweiser' }[ROUTE.v] || ((ROUTE.v === 'sec' && SEC[ROUTE.id] ? SEC[ROUTE.id].de : 'Fiil') + ' · Wegweiser');
  document.title = t;
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  scrollMem.set(lastHash, window.scrollY);
  const back = navStack.length > 1 && navStack[navStack.length - 2] === location.hash;
  if (back) navStack.pop(); else navStack.push(location.hash);
  const prev = parseHash();
  if (!back && prev.v !== 'verb') UI.q = '';
  if (prev.v === 'verb' && !back) UI.tense = 'Präsens';
  lastHash = location.hash;
  render();
  window.scrollTo(0, back ? (scrollMem.get(location.hash) || 0) : 0);
});
navStack.push(location.hash);
function parentOf(r) {
  if (r.v === 'sec') return r.sub2 != null ? `#/s/${r.id}/${r.sub}` : r.sub != null ? `#/s/${r.id}` : `#/lvl/${SEC[r.id] ? SEC[r.id].lvl : 'a'}`;
  if (r.v === 'study') return '#/karten';
  return '#/';
}
function goBack() { if (navStack.length > 1) history.back(); else location.hash = parentOf(ROUTE); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-reveal], [data-flip]'); if (!t) return;
  const d = t.dataset;
  if (d.back !== undefined) return goBack();
  if (d.star) { e.preventDefault(); return toggleStar(d.star, t); }
  if (d.say) { e.preventDefault(); return say(d.say); }
  if (d.lvl) { store.set('lvl', d.lvl); location.hash = d.lvl === 'karten' ? '#/karten' : '#/lvl/' + d.lvl; return; }
  if (d.trtoggle !== undefined) { showTr = !showTr; store.set('showTr', showTr); t.setAttribute('aria-pressed', !showTr); t.textContent = showTr ? 'TR' : 'TR ✕'; applyTr(); document.querySelectorAll('.ph.open').forEach(x => x.classList.remove('open')); return; }
  if (d.reveal !== undefined) { if (!showTr) t.closest('.ph').classList.toggle('open'); return; }
  if (d.clear !== undefined) { const i = $('#q'); i.value = ''; i.dispatchEvent(new Event('input')); i.focus(); return; }
  if (d.cat !== undefined && t.classList.contains('chip')) { UI.cat = d.cat; document.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === d.cat)); fillGloss(); return; }
  if (d.wl) { UI.wl = d.wl; store.set('wl', d.wl); document.querySelectorAll('[data-wl]').forEach(b => b.setAttribute('aria-pressed', b.dataset.wl === d.wl)); fillWords(); return; }
  if (d.tense) { UI.tense = d.tense; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (d.qa) return answerQuiz(t);
  if (d.retry !== undefined) { const box = t.closest('[data-quiz]'); box.querySelectorAll('.q').forEach(q => { delete q.dataset.done; delete q.dataset.right; q.querySelectorAll('button').forEach(b => b.classList.remove('ok', 'no')); }); box.querySelector('.score').hidden = true; return; }
  if (d.newtest !== undefined) { e.preventDefault(); render(); window.scrollTo(0, 0); return; }
  if (d.dir) { store.set('dir', d.dir); document.querySelectorAll('[data-dir]').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === d.dir)); return; }
  if (d.study) { e.preventDefault(); return startStudy(d.study); }
  if (d.flip !== undefined) { if (SESSION && !SESSION.flip) { SESSION.flip = true; render(); } return; }
  if (d.grade) return grade(d.grade === '1');
  if (d.sayall) { const b = D.bild[+d.sayall]; return say(b.secs.flatMap(s => s.name === 'fragen' ? [] : s.lines.map(l => l[0])).join(' ')); }
  if (d.sayplan) { const p = D.planen[+d.sayplan]; return say(p.secs.flatMap(s => s.lines.map(l => l[0].replace(/^[AB]:\s*/, ''))).join(' ')); }
  if (d.saybrief) { const [k, n] = d.saybrief.split(':'); const b = D[k][+n]; return say(b.secs.flatMap(s => s.lines.map(l => l[0])).join(' ')); }
  if (d.sayentry) { const [k, n] = d.sayentry.split(':'); const e = D[k][+n]; return say(e.secs.flatMap(s => s.lines.map(l => l[0].replace(/^[AB]:\s*/, ''))).join(' ')); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  if (ROUTE.v === 'search') { UI.sq = e.target.value; fillSearch(); }
  else { UI.q = e.target.value; fillVerbList(); fillWords(); fillGloss(); fillBriefe(); }
});

try { const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.claude && window.claude.use)) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
</body>
</html>
