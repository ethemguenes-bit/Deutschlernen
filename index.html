<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Satzheft">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Satzheft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a one-screen study app on squared exercise-book paper — header, scrolling sheet, bottom tabs; mistakes get the teacher's red pen. */
:root{
  --paper:#f4f6fb; --sheet:#ffffff; --grid:rgba(47,79,216,.075); --ink:#1b2350; --ink-soft:#5b6385; --line:#dde2ef;
  --accent:#2f4fd8; --accent-ink:#ffffff; --accent-bg:#e8ecfd;
  --red:#c8352b; --red-bg:#fbe8e6; --green:#1b8556; --green-bg:#e2f3ea; --amber:#a86d12; --amber-bg:#fbefd8; --rose:#b8336f;
  --shadow:0 1px 2px rgba(27,35,80,.06),0 6px 20px rgba(27,35,80,.06);
  --f-sent:'Literata',Georgia,'Times New Roman',serif;
  --f-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10131c; --sheet:#181c28; --grid:rgba(142,162,255,.05); --ink:#e6e9f6; --ink-soft:#99a1c0; --line:#2a3044;
  --accent:#8ea2ff; --accent-ink:#0e1330; --accent-bg:#232b4d;
  --red:#ff8c80; --red-bg:#3a1f1d; --green:#62d3a1; --green-bg:#173129; --amber:#f0c068; --amber-bg:#352b15; --rose:#ff8fc4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10131c; --sheet:#181c28; --grid:rgba(142,162,255,.05); --ink:#e6e9f6; --ink-soft:#99a1c0; --line:#2a3044;
  --accent:#8ea2ff; --accent-ink:#0e1330; --accent-bg:#232b4d;
  --red:#ff8c80; --red-bg:#3a1f1d; --green:#62d3a1; --green-bg:#173129; --amber:#f0c068; --amber-bg:#352b15; --rose:#ff8fc4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:640px;margin:0 auto;width:100%}

.app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-sent);font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--red);font-weight:600}
.hchips{display:flex;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.hchip{display:flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet)}
.hchip svg{width:14px;height:14px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .inner{padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
nav.tabs{flex:none;background:var(--sheet);border-top:1px solid var(--line)}
nav.tabs .inner{display:grid;grid-template-columns:repeat(6,1fr)}
.rulebox .rule{font-size:17px;line-height:1.5;margin:0}
.hl{color:var(--accent);font-weight:700}
.ig-wrap{overflow-x:auto;margin:0 -4px}
.ig-table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.ig-table th,.ig-table td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.ig-table thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:2px solid var(--line)}
.ig-table tbody th{font-weight:600;color:var(--ink-soft);font-size:13px;white-space:nowrap}
.ig-table td{font-family:var(--f-sent)}
.ig-table thead th.cm{color:var(--accent)} .ig-table thead th.cf{color:var(--rose)} .ig-table thead th.cn{color:var(--green)}
.ig-table td.cm{background:color-mix(in srgb,var(--accent) 7%,transparent)} .ig-table td.cf{background:color-mix(in srgb,var(--rose) 7%,transparent)} .ig-table td.cn{background:color-mix(in srgb,var(--green) 7%,transparent)}
.ig-pairs{margin:0;display:flex;flex-direction:column;gap:8px}
.ig-pairs div{display:flex;flex-direction:column;gap:1px}
.ig-pairs dt{font-family:var(--f-sent);font-size:16px}
.ig-pairs dd{margin:0;color:var(--ink-soft);font-size:14px}
.ig-slots{display:flex;flex-direction:column;gap:10px}
.slrow{display:flex;flex-direction:column;gap:4px}
.sllab{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.slcells{display:flex;flex-wrap:wrap;gap:5px}
.sl{display:inline-block;font-family:var(--f-sent);font-size:16px;padding:4px 9px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.sl-v{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sl-v2{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--sheet)}
.sl-s{background:var(--green-bg);border-color:transparent;color:var(--green)}
.sl-c{background:var(--amber-bg);border-color:transparent;color:var(--amber);font-weight:600}
.sl-n{background:var(--red-bg);border-color:transparent;color:var(--red)}
.sllegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft)}
.sllegend span{display:inline-flex;align-items:center;gap:5px}
.sllegend i.sl{width:14px;height:14px;padding:0;border-radius:4px}
.ig-formula{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fparts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fparts .sl{font-size:18px;padding:6px 12px}
.fop{font-size:22px;font-weight:700;color:var(--ink-soft)}
.ig-flow{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.ig-flow li span{display:block;font-family:var(--f-sent);color:var(--ink-soft)}
.ig-time{display:grid;gap:4px;position:relative;padding-top:12px}
.ig-time::before{content:"";position:absolute;left:6%;right:6%;top:17px;height:2px;background:var(--line)}
.tpt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative;min-width:0}
.tpt i{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--sheet);margin-bottom:4px}
.tpt b{font-size:13px}
.tpt span[lang]{font-family:var(--f-sent);font-size:14px;overflow-wrap:anywhere}
.ig-svg{width:100%;max-width:420px;height:auto;align-self:center}
.ig-svg .wbox{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.ig-svg .wball{fill:var(--accent)} .ig-svg .wfaint{opacity:.45}
.ig-svg .warrow{fill:none;stroke:var(--red);stroke-width:2.5;stroke-dasharray:5 4}
.ig-svg .warrhead{fill:var(--red)}
.ig-svg .wsep{stroke:var(--line);stroke-width:1.5}
.ig-svg text{fill:var(--ink);font-family:var(--f-ui);text-anchor:middle}
.ig-svg .wt{font-size:13px;font-weight:700} .ig-svg .ws{font-size:13px;fill:var(--ink-soft);font-family:var(--f-sent)}
.ig-compare{display:flex;flex-direction:column;gap:10px}
.cmprow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
@media (min-width:560px){.cmprow{grid-template-columns:1fr 1fr}}
.cmprow>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.cmplab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600}
.cmprow span[lang]{font-family:var(--f-sent);font-size:16px;overflow-wrap:anywhere}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0}
.exlist li+li{border-top:1px solid var(--line)}
.exlist li>div{min-width:0}
.exlist .de{font-family:var(--f-sent);font-size:17px;margin:0;overflow-wrap:anywhere}
.exlist .tr{margin:0;color:var(--ink-soft);font-size:14px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.stitle{font-family:var(--f-sent);font-size:clamp(24px,6vw,30px);margin:0}
.story{display:flex;flex-direction:column;gap:4px;padding-block:10px}
.sent{padding:6px 8px;margin:0 -8px;border-radius:8px;transition:background .2s}
.sent.cur{background:var(--accent-bg)}
.sent .de{font-family:var(--f-sent);font-size:19px;line-height:1.6;margin:0;overflow-wrap:anywhere}
.w{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:3px;touch-action:manipulation}
.w:hover{background:var(--accent-bg)}
.w.on{background:var(--amber-bg);color:var(--ink);box-shadow:0 0 0 2px var(--amber-bg)}
.tbtn{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:6px;padding:1px 6px;vertical-align:2px;margin-left:2px}
.tbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.trow{display:flex;flex-direction:column;gap:6px;padding:4px 0 6px;border-left:2px solid var(--accent);padding-left:10px;margin-top:4px}
.trow .tr{margin:0;color:var(--ink-soft)}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;min-height:32px}
.mini svg{width:14px;height:14px}
.q p{margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;min-height:44px}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:600}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt:disabled{cursor:default;opacity:1}
#wordbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:600px;z-index:40;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:15px}
#wordbar>div{flex:1}
body.wb main .inner{padding-bottom:120px}
#wordbar b{font-family:var(--f-sent);font-size:18px;margin-right:6px}

.gbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gstat{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.gstat b{color:var(--ink);font-size:16px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.gtile{display:flex;align-items:center;flex-wrap:wrap;gap:0 .3em;min-height:58px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;font-size:16px;line-height:1.3;text-align:left;overflow-wrap:anywhere;box-shadow:var(--shadow);transition:background .15s,border-color .15s,opacity .3s}
.gtile.de{font-family:var(--f-sent);font-size:17px}
.gtile.sel{border-color:var(--accent);background:var(--accent-bg)}
.gtile.done{border-color:transparent;background:var(--green-bg);color:var(--green);opacity:.5;box-shadow:none;cursor:default}
.gtile.done .art{color:inherit}
.gtile.bad{border-color:var(--red);background:var(--red-bg);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.art{font-weight:600}
.art-der{color:var(--accent)} .art-die{color:var(--rose)} .art-das{color:var(--green)}
.weaklist .de .art{font-family:var(--f-ui);font-size:.9em}

nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-soft)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.plain{padding:0 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 10px;font-weight:600}
h3{margin:0;font-size:17px;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

/* today */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.today div{display:flex;flex-direction:column;gap:2px}
.today strong{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:700}
.today span{font-size:13px;color:var(--ink-soft)}
.today .n-learn strong{color:var(--red)} .today .n-rev strong{color:var(--green)} .today .n-new strong{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:9px 4px;font-size:13px;font-weight:500;color:var(--ink-soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--ink);font-weight:600}
.method{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:m}
.method li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.method li::before{counter-increment:m;content:counter(m);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}

/* study */
.sbar{display:flex;align-items:center;gap:12px}
.sbar .meter{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar .meter i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.sbar .cnt{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.card{display:flex;flex-direction:column;gap:16px;min-height:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.chip.new{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.chip.learn{background:var(--red-bg);border-color:transparent;color:var(--red)}
.chip.young{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.mature{background:var(--green-bg);border-color:transparent;color:var(--green)}
.chip.weak{background:var(--red-bg);border-color:transparent;color:var(--red);font-weight:600}
.prompt{font-family:var(--f-sent);font-size:clamp(22px,5.5vw,28px);line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.lang{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:600}
textarea.ans{width:100%;min-height:76px;resize:vertical;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-family:var(--f-sent);font-size:18px;line-height:1.4}
textarea.ans:focus{border-style:solid;border-color:var(--accent);outline:none}
.answer{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.answer .de{font-family:var(--f-sent);font-size:clamp(21px,5vw,26px);line-height:1.4;overflow-wrap:anywhere}
.w-ok{color:var(--green)}
.w-miss{color:var(--red);text-decoration:underline wavy var(--red);text-underline-offset:4px;text-decoration-thickness:1.5px}
.typed{font-family:var(--f-sent);font-size:16px;color:var(--ink-soft);overflow-wrap:anywhere}
.typed s{color:var(--red)}
.score{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px}
.score.good{background:var(--green-bg);color:var(--green)} .score.mid{background:var(--amber-bg);color:var(--amber)} .score.bad{background:var(--red-bg);color:var(--red)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px}
.rate button b{font-size:14px}
.rate button span{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rate .g1{border-color:color-mix(in srgb,var(--red) 45%,var(--line))} .rate .g1 b{color:var(--red)}
.rate .g2 b{color:var(--amber)} .rate .g3 b{color:var(--green)} .rate .g4 b{color:var(--accent)}
.rate button.sugg{outline:2px solid currentColor;outline-offset:-1px}
.rate .g1.sugg{outline-color:var(--red)} .rate .g2.sugg{outline-color:var(--amber)} .rate .g3.sugg{outline-color:var(--green)} .rate .g4.sugg{outline-color:var(--accent)}
.kbd{font-size:12px;color:var(--ink-soft)}
.rate-hint{font-size:14px;font-weight:600;margin:4px 0 -6px}
.bigplay{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;align-self:center}
.bigplay svg{width:34px;height:34px}

/* list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--sheet);min-height:42px}
.toolbar input{flex:1 1 180px;min-width:0}
.toolbar select{flex:0 1 auto;max-width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.slist{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slist li+li{border-top:1px solid var(--line)}
.slist button{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.slist .de{font-family:var(--f-sent);font-size:16px;min-width:0;overflow-wrap:anywhere}
.slist .tr{font-size:13px;color:var(--ink-soft);grid-column:1;min-width:0;overflow-wrap:anywhere}

    const s = S.words[w.id] || { w: 0, k: 0 };
    if (game.missed.has(w.id)) s.w++; else s.k++;
    s.ls = game.end; S.words[w.id] = s;
  }
  const secs = Math.round((game.end - game.start) / 1000), lvl = S.settings.level || 'all';
  S.game = S.game || { best: {}, rounds: 0 }; S.game.rounds++;
  if (!game.wrong && (!S.game.best[lvl] || secs < S.game.best[lvl])) { S.game.best[lvl] = secs; game.newBest = true; }
  today().g = (today().g || 0) + 1;
  save(); render();
}
function hardWords(n) {
  const out = [];
  for (const w of WORDS) { const s = wordStat(w.id); if (s && s.w) out.push({ w, s }); }
  return out.sort((a, b) => (b.s.w / (b.s.w + b.s.k)) - (a.s.w / (a.s.w + a.s.k)) || b.s.w - a.s.w).slice(0, n);
}
function viewGame() {
  const lvl = S.settings.level || 'all';
  const best = (S.game && S.game.best[lvl]) || 0;
  if (game && !game.end) {

    return `<div class="gbar">

        <span class="gstat">Hata <b id="gWrong">${game.wrong}</b></span>
        <span class="gstat"><b id="gLeft">${game.words.length - game.done.size}</b> çift</span>

      <div class="board">
        <div class="gcol" aria-label="Almanca">${game.left.map(id => tile(id, 'de')).join('')}</div>

  }
  if (game && game.end) {
    const secs = Math.round((game.end - game.start) / 1000);
    const missed = game.words.filter(w => game.missed.has(w.id));
    return `<section class="sheet stack">
      <h3>${game.wrong ? 'Tur bitti' : 'Hatasız tur!'}${game.newBest ? ' Yeni rekor.' : ''}</h3>

        <div><strong>${best ? fmtSecs(best) : '–'}</strong><span>en iyi (hatasız)</span></div>
      </div>
      ${missed.length ? `<div><h2>Karıştırdığın kelimeler</h2><ul class="weaklist">${missed.map(w => `<li><span class="de" lang="de">${artHtml(w.de)}</span><span class="tr">${esc(w.tr)}</span>${canSpeak() ? `<button class="iconbtn" data-say="${esc(w.de)}" aria-label="Dinle" style="grid-column:2;grid-row:1 / span 2">${ICON.play}</button>` : ''}</li>`).join('')}</ul><p class="muted small" style="margin-top:6px">Bunlar sonraki turlarda daha sık çıkacak.</p></div>` : ''}
      <div class="row"><button class="btn primary" data-act="gstart" style="flex:1">Yeni tur</button><button class="btn" data-act="gquit">Bitir</button></div>
    </section>`;
  }
  const hard = hardWords(8);

  <section class="sheet stack">

    <div class="row small muted">${S.game && S.game.rounds ? `<span>${S.game.rounds} tur oynandı</span>` : ''}${best ? `<span>· Bu seviyede en iyi süre: <b>${fmtSecs(best)}</b></span>` : ''}</div>
    <button class="btn primary wide" data-act="gstart">Oyunu başlat</button>
  </section>
  <section class="stack plain">
    <h2 style="margin:0">Seviye</h2>
    ${levelButtons(WORDS)}
  </section>
  <section class="sheet">
    <h2>Zorlandığın kelimeler</h2>
    ${hard.length ? `<ul class="weaklist">${hard.map(x => `<li><span class="de" lang="de">${artHtml(x.w.de)}</span><span class="tr">${esc(x.w.tr)}</span><span class="errn">${x.s.w} hata / ${x.s.w + x.s.k}</span></li>`).join('')}</ul>` : `<p class="muted">Henüz yok. Eşleştirirken karıştırdığın kelimeler burada listelenir.</p>`}

  const c = prev ? { ...prev } : { s: 0, e: 2.5, i: 0, d: 0, st: 0, r: 0, l: 0, w: 0, k: 0 };
  if (c.s === 0 || c.s === 1) {
    c.s = 1;
    if (g === 1) { c.st = 0; c.d = now + LEARN[0] * MIN; }
    else if (g === 2) { c.d = now + Math.round(LEARN[c.st] * 1.5) * MIN; }
    else if (g === 3) { c.st++; if (c.st >= LEARN.length) { c.s = 2; c.i = 1; c.d = dueAt(1, now); } else c.d = now + LEARN[c.st] * MIN; }
    else { c.s = 2; c.i = 4; c.d = dueAt(4, now); }
  } else if (c.s === 2) {
    if (g === 1) { c.l++; c.e = Math.max(1.3, c.e - 0.2); c.i = Math.max(1, Math.round(c.i * 0.3)); c.s = 3; c.st = 0; c.d = now + RELEARN[0] * MIN; }
    else {
      if (g === 2) { c.e = Math.max(1.3, c.e - 0.15); c.i = Math.max(c.i + 1, c.i * 1.2); }
      else if (g === 3) { c.i = Math.max(c.i + 1, c.i * c.e); }
      else { c.i = Math.max(c.i + 2, c.i * c.e * 1.3); c.e += 0.15; }
      c.i = Math.min(Math.round(c.i), 3650); c.d = dueAt(c.i, now);
    }
  } else { // relearning
    if (g === 1) { c.d = now + RELEARN[0] * MIN; }
    else if (g === 2) { c.d = now + 15 * MIN; }
    else { c.s = 2; if (g === 4) c.i += 1; c.d = dueAt(c.i, now); }

}
function fmtIvl(ms) {
  const m = ms / MIN;
  if (m < 60) return Math.max(1, Math.round(m)) + ' dk';
  if (m < 60 * 24) return Math.round(m / 60) + ' sa';
  const d = Math.round(ms / DAY);
  if (d < 31) return d + ' gün';
  if (d < 365) return (d / 30).toFixed(d < 300 ? 1 : 0).replace('.0', '') + ' ay';
  return (d / 365).toFixed(1).replace('.0', '') + ' yıl';
}

/* ---------- daily counters & stats ---------- */
function today() { const k = dayKey(); if (!S.days[k]) S.days[k] = { n: 0, ok: 0, nw: 0, x: 0 }; return S.days[k]; }
function todayRO() { return S.days[dayKey()] || { n: 0, ok: 0, nw: 0, x: 0 }; }
function newLimitLeft() { const t = todayRO(); return Math.max(0, S.settings.newPerDay + (t.x || 0) - t.nw); }
function streak() {
  let n = 0; let t = startOfDay();
  if (!(S.days[dayKey(t)] && S.days[dayKey(t)].n)) t -= DAY; // today not done yet still keeps yesterday's streak
  while (S.days[dayKey(t)] && S.days[dayKey(t)].n > 0) { n++; t -= DAY; }
  return n;
}
function counts() {
  const now = Date.now(); let learn = 0, rev = 0, fresh = 0;
  for (const s of allSentences()) {
    if (!activeDeck(s.deck)) continue;
    const c = cardOf(s.id);
    if (!c) { fresh++; continue; }
    if ((c.s === 1 || c.s === 3) && c.d <= now + 20 * MIN) learn++;
    else if (c.s === 2 && c.d <= now) rev++;
  }
  return { learn, rev, fresh: Math.min(fresh, newLimitLeft()), freshTotal: fresh };
}

/* ---------- study session ---------- */
let tab = 'study';
let sess = null; // {mode:'srs'|'weak', done, ok, lastId, cur, revealed, typed, weakQueue}
function pickNext() {
  const now = Date.now();
  if (sess.mode === 'weak') {
    while (sess.weakQueue.length) { const id = sess.weakQueue[0]; if (findSentence(id)) return id; sess.weakQueue.shift(); }
    return null;
  }
  const sents = allSentences().filter(s => activeDeck(s.deck));
  const learnDue = [], learnSoon = [], rev = [], fresh = [];
  for (const s of sents) {
    const c = cardOf(s.id);
    if (!c) fresh.push(s);
    else if (c.s === 1 || c.s === 3) (c.d <= now ? learnDue : (c.d <= now + 20 * MIN ? learnSoon : null))?.push(s);
    else if (c.d <= now) rev.push(s);
  }
  const byDue = (a, b) => cardOf(a.id).d - cardOf(b.id).d;
  learnDue.sort(byDue); learnSoon.sort(byDue);
  // reviews: most-missed first, then most overdue
  rev.sort((a, b) => { const ca = cardOf(a.id), cb = cardOf(b.id); return (cb.l - ca.l) || (ca.d - cb.d); });
  // new: user's own sentences first, then by level order
  fresh.sort((a, b) => (b.custom - a.custom) || (deckRank(a.deck) - deckRank(b.deck)));
  const freshOk = newLimitLeft() > 0 ? fresh : [];
  const order = [];
  // every 4th card is a new one so new sentences don't wait behind a long review pile
  const wantNew = freshOk.length && (sess.done % 4 === 3 || !rev.length);
  order.push(...learnDue);
  if (wantNew) order.push(freshOk[0], ...rev); else order.push(...rev, ...freshOk.slice(0, 1));
  order.push(...learnSoon);
  if (!order.length) return null;
  return (order.find(s => s.id !== sess.lastId) || order[0]).id;
}
function deckRank(d) { const i = DECK_ORDER.indexOf(d); return i < 0 ? -1 : i; }
function startSession(mode) {
  sess = { mode, done: 0, ok: 0, lastId: null, cur: null, revealed: false, typed: '', start: Date.now(), weakQueue: [] };
  if (mode === 'weak') {
    sess.weakQueue = weakCards().slice(0, 20).map(x => x.s.id);
    if (!sess.weakQueue.length) { sess = null; toast('Henüz zayıf cümlen yok. Önce biraz tekrar yap.'); return; }
  }
  sess.cur = pickNext();
  render();
}
function weakCards() {
  const out = [];
  for (const s of allSentences()) { const c = cardOf(s.id); if (c && c.w > 0) out.push({ s, c, rate: c.w / (c.w + c.k) }); }
  out.sort((a, b) => (b.rate - a.rate) || (b.c.w - a.c.w));
  return out;
}
function reveal() {
  if (!sess || sess.revealed || !sess.cur) return;
  const ta = $('#ans'); sess.typed = ta ? ta.value : ''; if (ta) ta.blur();
  sess.revealed = true; render();
  const s = findSentence(sess.cur);
  if (S.settings.autoSpeak && s && sess.dirNow !== 'listen') speak(s.de);
}
function rate(g) {
  if (!sess || !sess.revealed) return;
  const id = sess.cur, now = Date.now();
  const prev = cardOf(id); const t = today();
  if (sess.mode === 'srs') {
    if (!prev) t.nw++;
    S.cards[id] = schedule(prev, g, now);
  } else if (!prev) { S.cards[id] = schedule(null, g, now); }
  const c = S.cards[id];
  if (g === 1) c.w = (c.w || 0) + 1; else c.k = (c.k || 0) + 1;
  c.ls = now;
  t.n++; if (g > 1) t.ok++;
  sess.done++; if (g > 1) sess.ok++;
  if (sess.mode === 'weak') { sess.weakQueue.shift(); if (g === 1) sess.weakQueue.splice(Math.min(3, sess.weakQueue.length), 0, id); }
  sess.lastId = id; sess.revealed = false; sess.typed = '';
  save();
  sess.cur = pickNext();
  render();
}

/* ---------- answer comparison ---------- */
function normTok(w, lang) {
  let s = w.toLocaleLowerCase(lang === 'tr' ? 'tr' : 'de');
  if (lang === 'de') s = s.replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss').replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u');
  else s = s.replace(/ı/g, 'i').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/â/g, 'a');
  return s.replace(/[^\p{L}\p{N}]/gu, '');
}
function compare(answer, typed, lang) {
  const A = answer.split(/\s+/).filter(Boolean), an = A.map(w => normTok(w, lang));
  const T = typed.split(/\s+/).filter(Boolean), tn = T.map(w => normTok(w, lang));
  const n = an.length, m = tn.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = an[i] && an[i] === tn[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const okA = new Set(), okT = new Set(); let i = 0, j = 0;
  while (i < n && j < m) { if (an[i] && an[i] === tn[j]) { okA.add(i); okT.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  const real = an.filter(Boolean).length, realT = tn.filter(Boolean).length;
  const score = real ? okA.size / Math.max(real, realT) : 1;
  const ansHtml = A.map((w, k) => `<span class="${okA.has(k) || !an[k] ? 'w-ok' : 'w-miss'}">${esc(w)}</span>`).join(' ');
  const typedHtml = T.map((w, k) => okT.has(k) || !tn[k] ? esc(w) : `<s>${esc(w)}</s>`).join(' ');
  return { score, ansHtml, typedHtml };
}

/* ---------- speech ---------- */
const speech = { synth: 'speechSynthesis' in window ? window.speechSynthesis : null, voice: null, tts: null };
function pickVoice() {
  if (!speech.synth) return;
  const vs = speech.synth.getVoices();
  speech.voice = vs.find(v => /^de[-_]DE/i.test(v.lang) && /google|natural|neural|premium|enhanced/i.test(v.name)) || vs.find(v => /^de[-_]DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null;
}
if (speech.synth) { pickVoice(); speech.synth.onvoiceschanged = pickVoice; }
function canSpeak() { return !!(speech.synth || speech.tts); }
function speak(text, slow) {
  const rate = (S.settings.rate || 0.9) * (slow ? 0.7 : 1);
  if (speech.synth) {
    try {
      speech.synth.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; if (speech.voice) u.voice = speech.voice; u.rate = rate;
      speech.synth.speak(u); return;
    } catch (e) {}
  }
  if (speech.tts) { speech.tts.speak(text, { language: 'de', rate: Math.min(1.5, Math.max(0.7, rate)) }).catch(() => {}); return; }
  toast('Bu cihazda seslendirme yok. Sayfayı Chrome veya Safari ile açmayı deneyin.');
}

/* ---------- rendering ---------- */
function renderHeader() {
  $('#hStreak').textContent = streak();
  const c = counts(); $('#hDue').textContent = c.learn + c.rev + c.fresh;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
}
function render() {
  renderHeader();
  const v = $('#view');
  if (tab === 'study') v.innerHTML = sess ? viewSession() : viewHome();
  else if (tab === 'list') v.innerHTML = viewList();
  else if (tab === 'game') v.innerHTML = viewGame();
  else if (tab === 'read') v.innerHTML = viewLearn();
  else if (tab === 'stats') v.innerHTML = viewStats();
  else v.innerHTML = viewSettings();
  afterRender();
}
function afterRender() {
  if (tab === 'study' && sess && sess.cur && !sess.revealed) {
    const ta = $('#ans');
    if (ta && matchMedia('(hover:hover)').matches) ta.focus();
    if (sess.dirNow === 'listen' && sess.spokenFor !== sess.cur) { sess.spokenFor = sess.cur; const s = findSentence(sess.cur); if (s) setTimeout(() => speak(s.de), 250); }
  }
  if (tab === 'study' && sess && sess.cur && sess.revealed) { const r = $('.rate'); if (r) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  if (tab === 'list') { const q = $('#q'); if (q && listState.focus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); listState.focus = false; } }
}

        ${c.freshTotal ? `<p class="muted small">Günlük yeni cümle sınırına (${S.settings.newPerDay}) ulaştın. Sınırı Ayarlar'dan değiştirebilirsin.</p><button class="btn wide" data-act="morenew">${ICON.plus} Bugün 5 yeni cümle daha</button>` : `<p class="muted small">${(S.settings.level || 'all') === 'all' ? 'Seçili destelerde' : LEVEL_LABEL[S.settings.level] + ' seviyesinde'} yeni cümle kalmadı. Başka bir seviye seçebilir ya da cümle ekleyebilirsin.</p>`}

    </div>

    <ol class="method">
      <li><span>Türkçe cümleyi oku. Almancasını <b>önce sesli söyle</b>, istersen yaz. Tanımak yetmez, kendin üretmelisin.</span></li>
      <li><span>Cevabı aç, dinle ve cümleyi konuşmacıyla birlikte <b>yüksek sesle tekrar et</b> (gölgeleme).</span></li>

function viewSession() {
  const c = counts();
  const left = sess.mode === 'weak' ? sess.weakQueue.length : c.learn + c.rev + c.fresh;
  const pct = sess.done + left ? Math.round(100 * sess.done / (sess.done + left)) : 100;
  const bar = `<div class="sbar">
      <button class="iconbtn" data-act="quit" aria-label="Oturumu bitir">${ICON.close}</button>
      <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <span class="cnt">${sess.mode === 'weak' ? esc(sess.label || 'Zayıflar') + ' · ' : ''}${left} kaldı</span>
    </div>`;
  if (!sess.cur) {
    const acc = sess.done ? Math.round(100 * sess.ok / sess.done) : 0;
    const mins = Math.max(1, Math.round((Date.now() - sess.start) / MIN));
    return bar + `<section class="sheet stack">
      <h3>${sess.mode === 'weak' ? (sess.label ? 'Alıştırma bitti' : 'Zayıf cümleler bitti') : 'Bu oturum tamam'}</h3>
      <div class="today">
        <div><strong>${sess.done}</strong><span>kart</span></div>
        <div class="n-rev"><strong>%${acc}</strong><span>doğru</span></div>
        <div><strong>${mins}</strong><span>dakika</span></div>
      </div>
      <button class="btn primary wide" data-act="quit">Ana sayfaya dön</button>
    </section>`;
  }
  const s = findSentence(sess.cur); if (!s) { sess.cur = pickNext(); return viewSession(); }
  const card = cardOf(s.id); const st = statusOf(card);
  if (!sess.revealed || !sess.dirNow) sess.dirNow = S.settings.dir;
  const dir = sess.dirNow;
  const chips = `<div class="chips"><span class="chip">${esc(s.deck)}</span><span class="chip ${st}">${STATUS_LABEL[st]}</span>${isWeak(card) ? '<span class="chip weak">Zayıf</span>' : ''}</div>`;
  let promptHtml;
  if (dir === 'tr-de') promptHtml = `<div class="lang">Türkçe</div><div class="prompt">${esc(s.tr)}</div>`;
  else if (dir === 'de-tr') promptHtml = `<div class="lang">Almanca</div><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div class="prompt" style="flex:1;min-width:0">${esc(s.de)}</div>${canSpeak() ? `<button class="iconbtn" data-act="say" aria-label="Dinle">${ICON.play}</button>` : ''}</div>`;
  else promptHtml = `<div class="lang">Dinle ve Almancasını yaz</div><button class="bigplay" data-act="say" aria-label="Cümleyi dinle">${ICON.play}</button><button class="btn" data-act="sayslow" style="align-self:center">${ICON.slow} Yavaş</button>`;
  const targetLang = dir === 'de-tr' ? 'tr' : 'de';
  if (!sess.revealed) {
    return bar + `<section class="sheet card">${chips}${promptHtml}
      <textarea id="ans" class="ans" lang="${targetLang}" enterkeyhint="go" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="${targetLang === 'de' ? 'Almancasını yaz (isteğe bağlı)' : 'Türkçesini yaz (isteğe bağlı)'}"></textarea>
      <button class="btn primary wide" data-act="reveal">Cevabı göster</button>
      <p class="kbd">Enter: cevabı göster · 1–4: puanla</p>

  if (typed) { cmp = compare(answer, typed, targetLang); sugg = cmp.score >= 0.999 ? 3 : cmp.score >= 0.7 ? 2 : 1; }
  const prevs = [1, 2, 3, 4].map(g => {
    if (sess.mode === 'weak') return '';
    const n = schedule(card, g, Date.now()); return fmtIvl(n.d - Date.now());
  });
  const names = ['Bilemedim', 'Zor', 'İyi', 'Kolay'];
  const other = dir === 'tr-de' ? '' : `<div class="muted">${esc(dir === 'listen' ? s.tr : s.de)}</div>`;
  return bar + `<section class="sheet card">${chips}${dir === 'listen' ? `<div class="lang">Duyduğun cümle</div>` : promptHtml}
    <div class="answer">
      <div class="row" style="justify-content:space-between"><span class="lang">Cevap</span>${cmp ? `<span class="score ${cmp.score >= 0.999 ? 'good' : cmp.score >= 0.7 ? 'mid' : 'bad'}">%${Math.round(cmp.score * 100)} eşleşme</span>` : ''}</div>
      <div class="de" lang="${targetLang}">${cmp ? cmp.ansHtml : esc(answer)}</div>
      ${dir === 'listen' ? `<div class="muted">${esc(s.tr)}</div>` : other}
      ${cmp ? `<div class="typed">Senin cevabın: ${cmp.typedHtml}</div>` : ''}
      ${canSpeak() ? `<div class="row"><button class="btn" data-act="say">${ICON.play} Dinle</button><button class="btn" data-act="sayslow">${ICON.slow} Yavaş</button><span class="muted small">Dinle, sonra sesli tekrar et.</span></div>` : ''}
    </div>
    <p class="rate-hint">Ne kadar iyi bildin? Birine dokun, sonraki cümle gelir.</p>
    <div class="rate" role="group" aria-label="Ne kadar iyi bildin?">
      ${[1, 2, 3, 4].map(g => `<button class="g${g}${sugg === g ? ' sugg' : ''}" data-rate="${g}"><b>${names[g - 1]}</b><span>${prevs[g - 1] || '&nbsp;'}</span></button>`).join('')}
    </div>
    <button class="btn primary wide" data-rate="${sugg || 3}">Sonraki cümle → <span style="font-weight:400;opacity:.85">(${names[(sugg || 3) - 1]})</span></button>
    <p class="kbd">${sess.mode === 'weak' ? 'Alıştırma modu: puanın tekrar takvimini değiştirmez, hataların sayılır.' : 'Altındaki süre, cümlenin bir sonraki gelişine kadar geçecek zaman.'}</p>
  </section>`;
}

/* list */
const listState = { q: '', f: 'all', deck: '', limit: 150, focus: false };
function viewList() {
  const q = normTok(listState.q.replace(/\s+/g, ''), 'de');
  const qt = normTok(listState.q.replace(/\s+/g, ''), 'tr');
  const all = allSentences();
  const rows = all.filter(s => {
    if (listState.deck && s.deck !== listState.deck) return false;
    const c = cardOf(s.id), st = statusOf(c);
    if (listState.f === 'weak' && !isWeak(c)) return false;
    if (listState.f === 'mine' && !s.custom) return false;
    if (['new', 'learn', 'young', 'mature'].includes(listState.f) && st !== listState.f) return false;
    if (q || qt) { const de = normTok(s.de.replace(/\s+/g, ''), 'de'), tr = normTok(s.tr.replace(/\s+/g, ''), 'tr'); if (!de.includes(q) && !tr.includes(qt)) return false; }
    return true;
  });
  if (listState.f === 'weak') rows.sort((a, b) => (cardOf(b.id).w - cardOf(a.id).w));
  const F = [['all', 'Tümü'], ['new', 'Yeni'], ['learn', 'Öğreniliyor'], ['young', 'Tekrarda'], ['mature', 'Ezberlendi'], ['weak', 'Zayıf'], ['mine', 'Benim eklediklerim']];
  const shown = rows.slice(0, listState.limit);
  return `
  <div class="row" style="justify-content:space-between">
    <div><h3>Cümleler</h3><p class="muted small">${all.length} cümle, ${deckNames().length} deste</p></div>
    <button class="btn primary" data-act="add">${ICON.plus} Cümle ekle</button>

/* stats */
function viewStats() {
  const all = allSentences(); const dist = { new: 0, learn: 0, young: 0, mature: 0 };
  let w = 0, k = 0;
  for (const s of all) { const c = cardOf(s.id); dist[statusOf(c)]++; if (c) { w += c.w || 0; k += c.k || 0; } }
  let n30 = 0, ok30 = 0, active = 0;
  const days = []; for (let i = 29; i >= 0; i--) { const t = startOfDay() - i * DAY; const d = S.days[dayKey(t)] || { n: 0, ok: 0 }; days.push({ t, ...d }); n30 += d.n; ok30 += d.ok; if (d.n) active++; }
  const acc = n30 ? Math.round(100 * ok30 / n30) : 0;
  const tot = all.length || 1;
  const cols = { new: 'var(--accent)', learn: 'var(--red)', young: 'var(--amber)', mature: 'var(--green)' };
  // 30-day chart
  const W = 600, H = 170, pl = 28, pr = 8, pt = 10, pb = 22, cw = (W - pl - pr) / 30;
  const max = Math.max(5, ...days.map(d => d.n)); const nice = Math.ceil(max / 5) * 5;
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let bars = '';
  days.forEach((d, i) => {
    const x = pl + i * cw + cw * 0.15, bw = cw * 0.7;
    if (d.n) {
      bars += `<rect x="${x.toFixed(1)}" y="${y(d.ok).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(d.ok)).toFixed(1)}" rx="2" fill="var(--green)"><title>${dayKey(d.t)}: ${d.n} kart, ${d.n - d.ok} yanlış</title></rect>`;
      if (d.n - d.ok) bars += `<rect x="${x.toFixed(1)}" y="${y(d.n).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(d.ok) - y(d.n)).toFixed(1)}" rx="2" fill="var(--red)"><title>${dayKey(d.t)}: ${d.n - d.ok} yanlış</title></rect>`;
    }
  });
  const grid = [0, nice / 2, nice].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const fmtD = t => { const d = new Date(t); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
  const xl = [0, 15, 29].map(i => `<text x="${pl + i * cw + cw / 2}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}">${i === 29 ? 'bugün' : fmtD(days[i].t)}</text>`).join('');
  // next 7 days forecast
  const fc = []; for (let i = 0; i < 7; i++) fc.push(0);
  const now = Date.now();
  for (const s of all) { const c = cardOf(s.id); if (!c || c.s !== 2) continue; const di = Math.max(0, Math.floor((startOfDay(c.d) - startOfDay()) / DAY)); if (c.d <= now) fc[0]++; else if (di < 7) fc[di]++; }
  const fmax = Math.max(1, ...fc);
  const dn = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  const weak = weakCards().slice(0, 10);
  return `
  <div class="tiles">
    <div class="tile"><strong>${streak()}</strong><span>gün seri</span></div>
    <div class="tile"><strong>${todayRO().n}</strong><span>bugün çalışılan</span></div>
    <div class="tile"><strong>%${acc}</strong><span>doğruluk (30 gün)</span></div>
    <div class="tile"><strong>${dist.mature}</strong><span>ezberlenen cümle</span></div>
  </div>
  <section class="sheet">
    <h2>Cümlelerin durumu</h2>
    <div class="distbar" role="img" aria-label="Durum dağılımı">${['mature', 'young', 'learn', 'new'].map(k => dist[k] ? `<i style="width:${100 * dist[k] / tot}%;background:${cols[k]}"></i>` : '').join('')}</div>
    <div class="legend">${['mature', 'young', 'learn', 'new'].map(k => `<span><i style="background:${cols[k]}"></i>${STATUS_LABEL[k]} ${dist[k]}</span>`).join('')}</div>
    <p class="muted small" style="margin-top:10px">“Ezberlendi”: tekrar aralığı 3 haftayı geçen cümleler. Toplam ${k + w} cevap, ${w} tanesi yanlış.</p>
  </section>
  <section class="sheet chart">
    <h2>Son 30 gün</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 30 günde günlük çalışılan kart sayısı">${grid}${bars}${xl}</svg>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--green)"></i>Doğru</span><span><i style="background:var(--red)"></i>Yanlış</span><span class="muted">${active} gün çalışıldı</span></div>
  </section>
  <section class="sheet">
    <h2>Önümüzdeki 7 gün</h2>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px">
      ${fc.map((v, i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="small" style="font-variant-numeric:tabular-nums">${v}</span><div style="width:70%;background:${i === 0 ? 'var(--accent)' : 'var(--accent-bg)'};border-radius:4px;height:${Math.max(2, 70 * v / fmax)}px"></div><span class="small muted">${i === 0 ? 'Bugün' : dn[new Date(startOfDay() + i * DAY).getDay()]}</span></div>`).join('')}
    </div>
  </section>
  <section class="sheet">
    <h2>Öğren</h2>
    <p>${LESSONS.filter(l => lessonStat(l.id)).length} / ${LESSONS.length} gramer dersi tamamlandı.</p>
    <p>${STORIES.filter(s => storyStat(s.id) && storyStat(s.id).read).length} / ${STORIES.length} hikaye okundu.${(() => { const r = Object.values(S.stories || {}); const a = r.reduce((n, x) => n + x.score, 0), b = r.reduce((n, x) => n + x.total, 0); return b ? ` Anlama sorularında ${a}/${b} doğru.` : ''; })()}</p>
  </section>
  <section class="sheet">
    <h2>Kelime oyunu</h2>
    ${S.game && S.game.rounds ? `<p>${S.game.rounds} tur oynandı. ${Object.keys(S.game.best).length ? 'En iyi hatasız süreler: ' + Object.entries(S.game.best).map(([l, s]) => `${LEVEL_LABEL[l]} <b>${fmtSecs(s)}</b>`).join(', ') + '.' : ''}</p>${hardWords(1).length ? `<p class="muted small">En çok karıştırılan: ${hardWords(3).map(x => esc(x.w.de)).join(', ')}</p>` : ''}` : `<p class="muted">Henüz oynanmadı. Alttaki <b>Oyun</b> sekmesinden başlayabilirsin.</p>`}
  </section>
  <section class="sheet">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">En çok yanlış yapılanlar</h2>${weak.length ? `<button class="btn" data-act="weak">Bunları çalış</button>` : ''}</div>
    ${weak.length ? `<ul class="weaklist">${weak.map(x => `<li><span class="de" lang="de">${esc(x.s.de)}</span><span class="tr">${esc(x.s.tr)}</span><span class="errn">${x.c.w} hata / ${x.c.w + x.c.k}</span></li>`).join('')}</ul>` : `<p class="muted">Henüz yanlış yok. “Bilemedim” dediğin cümleler burada listelenir.</p>`}
  </section>`;
}

function addSentences(pairs, deck) {
  const known = new Set(allSentences().map(s => s.de.trim().toLowerCase()));
  let added = 0, dup = 0;
  for (const [tr, de] of pairs) {
    if (!tr || !de) continue;
    if (known.has(de.toLowerCase())) { dup++; continue; }
    known.add(de.toLowerCase());
    S.custom.push({ id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tr, de, deck: deck || 'Benim cümlelerim', added: Date.now() });
    added++;
  }
  if (deck) S.settings.skipDecks = (S.settings.skipDecks || []).filter(x => x !== deck);
  save();
  return { added, dup };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#wordbar') && !e.target.closest('.w') && !$('#wordbar').hidden) hideWord();
  const t = e.target.closest('button,[data-edit]'); if (!t) return;
  if (t.dataset.gde || t.dataset.gtr) { gameTap(t); return; }
  if (t.classList.contains('w')) { showWord(t); return; }
  if (t.dataset.learn) { learnSub = t.dataset.learn; reader = null; lesson = null; render(); return; }
  if (t.dataset.lesson) { lesson = { id: t.dataset.lesson, ans: {}, checked: false }; render(); $('#main').scrollTop = 0; return; }
  if (t.dataset.lq) { const [qi, oi] = t.dataset.lq.split(':').map(Number); lesson.ans[qi] = oi; render(); return; }
  if (t.dataset.story) { openStory(t.dataset.story); return; }
  if (t.dataset.st) { const i = +t.dataset.st; reader.open.has(i) ? reader.open.delete(i) : reader.open.add(i); if (reader.all) { reader.all = false; curStory().sents.forEach((_, k) => k !== i && reader.open.add(k)); reader.open.delete(i); } render(); return; }
  if (t.dataset.sadd) { const st = curStory(); const [de, tr] = st.sents[+t.dataset.sadd]; const r = addSentences([[tr, de]], st.level + ' · Hikaye cümleleri'); toast(r.added ? 'Kartlarına eklendi' : 'Bu cümle zaten kartlarında'); return; }
  if (t.dataset.sq) { const [qi, oi] = t.dataset.sq.split(':').map(Number); reader.ans[qi] = oi; render(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; hideWord(); stopStory(); if (tab === 'read') { reader = null; lesson = null; } render(); $('#main').scrollTop = 0; return; }
  if (t.dataset.dir) { S.settings.dir = t.dataset.dir; save(); render(); return; }
  if (t.dataset.level) { S.settings.level = t.dataset.level; save(); render(); toast(t.dataset.level === 'all' ? 'Tüm seviyeler seçildi' : 'Seviye: ' + LEVEL_LABEL[t.dataset.level]); return; }
  if (t.dataset.rate) { rate(+t.dataset.rate); return; }
  if (t.dataset.f) { listState.f = t.dataset.f; listState.limit = 150; render(); return; }
  if (t.dataset.edit) { openEdit(t.dataset.edit); return; }
  if (t.dataset.say) { speak(t.dataset.say); return; }
  if (t.dataset.addtab) { addTab = t.dataset.addtab; openAdd(); return; }
  const a = t.dataset.act; if (!a) return;
  if (a === 'start') startSession('srs');
  else if (a === 'weak') { tab = 'study'; startSession('weak'); }
  else if (a === 'quit') { sess = null; render(); }
  else if (a === 'reveal') reveal();
  else if (a === 'say' || a === 'sayslow') { const s = findSentence(sess && sess.cur); if (s) speak(s.de, a === 'sayslow'); }
  else if (a === 'morenew') { today().x = (today().x || 0) + 5; save(); startSession('srs'); }
  else if (a === 'add') openAdd();
  else if (a === 'lback') { lesson = null; render(); $('#main').scrollTop = 0; }
  else if (a === 'lretry') { lesson.ans = {}; lesson.checked = false; render(); }
  else if (a === 'lcheck') { const L = curLesson(); lesson.checked = true; const sc = L.quiz.reduce((n, q, i) => n + (lesson.ans[i] === q.a ? 1 : 0), 0); S.lessons = S.lessons || {}; S.lessons[L.id] = { score: sc, total: L.quiz.length, at: Date.now() }; save(); render(); }
  else if (a === 'lpractice') { const L = curLesson(); startPractice(lessonSentences(L).ids, 'Gramer: ' + L.title); }
  else if (a === 'sback') { stopStory(); hideWord(); reader = null; render(); $('#main').scrollTop = 0; }
  else if (a === 'splay') playStory();
  else if (a === 'sstop') stopStory();
  else if (a === 'wclose') hideWord();
  else if (a === 'strall') { reader.all = !reader.all; reader.open.clear(); render(); }
  else if (a === 'sretry') { reader.ans = {}; reader.checked = false; render(); }
  else if (a === 'scheck') { const st = curStory(); reader.checked = true; const sc = st.qs.reduce((n, q, i) => n + (reader.ans[i] === q.ok ? 1 : 0), 0); S.stories = S.stories || {}; S.stories[st.id] = { read: 1, score: sc, total: st.qs.length, at: Date.now() }; save(); render(); }
  else if (a === 'gstart') startGame();
  else if (a === 'gquit') { game = null; clearInterval(gameTick); render(); }
  else if (a === 'more') { listState.limit += 150; render(); }
  else if (a === 'close') closeModal();
  else if (a === 'export') openExport();
  else if (a === 'import') openImport();
  else if (a === 'testsay') speak('Ich lerne jeden Tag ein bisschen Deutsch.');
  else if (a === 'reset') confirmBox('İlerlemeyi sıfırla', 'Tüm tekrar geçmişi ve istatistikler silinecek. Eklediğin cümleler kalacak. Bu geri alınamaz.', 'Sıfırla', () => { S.cards = {}; S.days = {}; S.stories = {}; S.lessons = {}; S.words = {}; S.game = { best: {}, rounds: 0 }; save(); render(); toast('İlerleme sıfırlandı'); });
  else if (a === 'resetcard') { const id = $('#editForm').dataset.id; delete S.cards[id]; save(); closeModal(); render(); toast('Cümle yeniden “yeni” oldu'); }
  else if (a === 'delcard') {
    const id = $('#editForm').dataset.id; const s = findSentence(id);
    confirmBox(s.custom ? 'Cümleyi sil' : 'Listeden kaldır', `“${s.de}” ${s.custom ? 'silinecek' : 'listeden kaldırılacak'}.`, s.custom ? 'Sil' : 'Kaldır', () => {
      if (s.custom) S.custom = S.custom.filter(c => c.id !== id); else S.hidden[id] = 1;
      delete S.cards[id]; save(); render(); toast('Kaldırıldı');
    });
  }
});
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'addForm') {
    const deck = ($('#fDeck').value || '').trim() || 'Benim cümlelerim';
    let pairs;
    if (addTab === 'one') pairs = [[$('#fTr').value.trim(), $('#fDe').value.trim()]];
    else pairs = $('#fBulk').value.split('\n').map(l => { const p = l.includes('\t') ? l.split('\t') : l.split(';'); return [(p[0] || '').trim(), p.slice(1).join(';').trim()]; }).filter(p => p[0] && p[1]);
    if (!pairs.length) { toast('Satırları “Türkçe;Almanca” biçiminde yaz.'); return; }
    const r = addSentences(pairs, deck);
    toast(r.added ? `${r.added} cümle eklendi${r.dup ? `, ${r.dup} tanesi zaten vardı` : ''}` : 'Bu cümleler zaten listede');
    if (addTab === 'one' && r.added) { $('#fTr').value = ''; $('#fDe').value = ''; $('#fTr').focus(); } else if (r.added) closeModal();
    render();
  } else if (e.target.id === 'editForm') {
    const id = e.target.dataset.id; const s = findSentence(id);
    const tr = $('#eTr').value.trim(), de = $('#eDe').value.trim(); if (!tr || !de) return;
    if (s.custom) { const c = S.custom.find(x => x.id === id); c.tr = tr; c.de = de; c.deck = ($('#eDeck').value || '').trim() || c.deck; }
    else S.edits[id] = { tr, de };
    save(); closeModal(); render(); toast('Kaydedildi');
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ans' && /\n/.test(e.target.value)) { e.target.value = e.target.value.replace(/\n/g, ' ').trim(); reveal(); return; }
  if (e.target.id === 'q') { listState.q = e.target.value; listState.limit = 150; listState.focus = true; render(); }
  else if (e.target.id === 'setRate') { S.settings.rate = +e.target.value; $('#rateVal').textContent = S.settings.rate.toFixed(2); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'deckSel') { listState.deck = t.value; render(); }
  else if (t.id === 'setNew') { S.settings.newPerDay = +t.value; save(); }
  else if (t.id === 'setSpeak') { S.settings.autoSpeak = t.checked; save(); }
  else if (t.id === 'setRate') { save(); }
  else if (t.dataset.deck !== undefined) {
    const boxes = [...document.querySelectorAll('[data-deck]')];
    if (!boxes.some(x => x.checked)) { t.checked = true; toast('En az bir deste seçili olmalı'); return; }
    S.settings.skipDecks = boxes.filter(x => !x.checked).map(x => x.dataset.deck); save();
  }
});
document.addEventListener('keydown', e => {
  if (!$('#overlay').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (tab !== 'study' || !sess || !sess.cur) return;
  const inText = e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT';
  if (!sess.revealed && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); reveal(); return; }
  if (!sess.revealed && e.key === ' ' && !inText) { e.preventDefault(); reveal(); return; }
  if (sess.revealed && /^[1-4]$/.test(e.key) && !inText) { e.preventDefault(); rate(+e.key); }
});

/* ---------- boot ---------- */
S = loadLocal() || defaultState();
render();
initCloud();
// Installed app: work offline and ask the browser not to clear saved progress.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.claude && window.claude.use)) {
  // updateViaCache 'none': always fetch sw.js itself fresh; check again whenever the app comes back to the foreground.
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  // When a new version takes over, reload once so it shows right away (not in the middle of a study session).
  const hadController = !!navigator.serviceWorker.controller; let swReloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || swReloading) return;
    if (sess) { toast('Yeni sürüm hazır. Oturumu bitirince uygulamayı yeniden aç.'); return; }
    swReloading = true; location.reload();
  });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
if (window.claude && window.claude.use) window.claude.use('tts').then(t => { if (t) { speech.tts = t; if (!speech.synth) render(); } }).catch(() => {});
</script>
